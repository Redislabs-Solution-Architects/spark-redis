# The versions CI tests against. This file is the single source of truth for the test matrix
# (.github/workflows/ci.yml reads it). Update it when an upstream line ships or reaches end of life;
# see doc/modernization/spec.md §1 for the policy. Every line in `redis` and `redis_secondary` is supported.

# The Redis line every pull request must pass, as a Docker image tag. It also runs after each merge and nightly.
redis: ["8.6"]

# The other supported Redis lines. CI runs them after each merge to master or spike/phase-0, nightly and on
# manual dispatch, never on pull requests. These jobs may fail without failing the build.
redis_secondary: ["8.2"]

# Upcoming Redis lines. CI tests the newest release-candidate tag of each (for example 8.12-rc3).
# These jobs may fail without failing the build. With an empty list, CI skips the preview job.
redis_preview: []

# JDKs for this 3.x build. Phase 1 adds 17, 21 and 25 together with the Spark lines.
jdk: ["8"]

# The Redis line for nightly benchmarks: the floor, the same as doc/modernization/benchmarks/baseline-3.x.md.
benchmark_redis: "8.2"
