# The versions CI tests against. This file is the single source of truth for the test matrix
# (.github/workflows/ci.yml reads it). Update it when an upstream line ships or reaches end of life;
# see doc/modernization/spec.md §1 for the policy. Every line in `spark`, `redis` and `redis_secondary` is supported.
# For now CI tests only the `redis` lines (owner decision, 2026-11-23): the other supported Redis lines (8.2 to 8.10,
# spec §1) return to `redis_secondary` before 4.0.0-M1.

# The Spark lines: one artifact, built by the module spark-<line>/, per line (see .claude/skills/new-spark-line).
# After each merge, CI tests every line.
spark: ["4.1", "4.2", "4.3"]

# The Spark line pull requests test, and the reference for docs and examples: the line with the longest maintenance
# window (roadmap, Phase 1 risk).
spark_reference: "4.2"

# The Redis lines every pull request must pass, as Docker image tags, on `spark_reference`. They also run after each
# merge, on every Spark line.
redis: ["8.6"]

# The other supported Redis lines. CI runs them after each merge to spike/phase-1, on every Spark line, never on
# pull requests. These jobs may fail without failing the build. Empty for now: see the top.
redis_secondary: []

# Upcoming Redis lines. CI tests the newest release-candidate tag of each (for example 8.12-rc3), on
# `spark_reference`. These jobs may fail without failing the build. With an empty list, CI skips the preview job.
redis_preview: []

# The JDK every job builds and tests with: the 4.x build targets JDK 17.
jdk: ["17"]

# The other supported JDK. The connector supports JDK 17 and 21, the JDKs every Spark 4 line supports. CI tests it
# after each merge on every Spark line with every `redis` line, never on pull requests. These jobs may fail without
# failing the build.
jdk_secondary: ["21"]

# The Redis line for CI's benchmark job: the floor, the same as doc/modernization/benchmarks/. The job runs only on
# a schedule or by hand, which GitHub allows only once the fork's master has ci.yml, so for now it doesn't run.
benchmark_redis: "8.2"
