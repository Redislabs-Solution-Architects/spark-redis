# Publishes the current SNAPSHOT to GitHub Packages in this fork (Phase 0 plan, step C9; spec 2.13).
#
# Run it by hand: Actions > Publish snapshot > Run workflow, or
#   gh workflow run publish-snapshot.yml -R Redislabs-Solution-Architects/spark-redis --ref <branch>
#
# The dry run keeps today's coordinates, com.redislabs:spark-redis_2.12:3.1.0-SNAPSHOT. Phase 1 switches to the
# per-Spark com.redis artifacts.
#
# Using the package: GitHub Packages needs a token even for public packages. Add the repository
# https://maven.pkg.github.com/Redislabs-Solution-Architects/spark-redis to your build, and give Maven a server
# entry with id "github", your GitHub user name, and a token with the read:packages scope. Phase 1 adds GitHub
# Release assets, which download without a token.
name: Publish snapshot

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-snapshot
  cancel-in-progress: false

jobs:
  publish:
    name: Deploy to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          # Writes ~/.m2/settings.xml with a "github" server that reads these environment variables.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Check that the version is a snapshot
        run: |
          version=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "Publishing $version"
          case "$version" in
            *-SNAPSHOT) ;;
            *) echo "::error::$version is not a SNAPSHOT. This workflow publishes snapshots only."; exit 1 ;;
          esac
      - name: Deploy
        run: ./mvnw -B deploy -DskipTests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
