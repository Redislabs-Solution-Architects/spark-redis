# Test matrix (Phase 1 plan, step B2; decision D1). versions.yml decides what runs:
# - pull requests: the `spark_reference` line on the `redis` line and the `jdk`, which a PR must pass;
# - after each merge to spike/phase-1, nightly, and by hand: every `spark` line on every `redis` and `redis_secondary`
#   line, and on the `jdk_secondary` JDK with the `redis` line, allowed to fail. By hand:
#   gh workflow run ci.yml -R Redislabs-Solution-Architects/spark-redis --ref spike/phase-1
# Each job builds and tests one Spark line's module (spark-<line>/). The tests start their own Redis in Docker through
# Testcontainers (see RedisContainers.scala), so no Redis is installed on the runner. Guardrail checks run separately,
# in guardrails.yml.
name: CI

on:
  push:
    branches: [master, 'spike/phase-0', 'spike/phase-1']
    paths-ignore: ['doc/**', '**/*.md']
  pull_request:
    paths-ignore: ['doc/**', '**/*.md']
  # GitHub runs a schedule only from the default branch's copy of a workflow, and lets a workflow be dispatched by hand
  # only when the default branch has it. So the fork's master has a small ci.yml of its own: nightly at 03:00 UTC it
  # dispatches this file on spike/phase-1, and this schedule never fires by itself. A dispatch on spike/phase-1 runs
  # this file directly.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Read versions.yml
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr: ${{ steps.read.outputs.pr }}
      full: ${{ steps.read.outputs.full }}
      spark_reference: ${{ steps.read.outputs.spark_reference }}
      jdk: ${{ steps.read.outputs.jdk }}
      preview: ${{ steps.read.outputs.preview }}
      benchmark_redis: ${{ steps.read.outputs.benchmark_redis }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        name: Read the matrix and find the newest release-candidate tags
        run: |
          set -euo pipefail
          yq -o=json versions.yml > "$RUNNER_TEMP/versions.json"
          # .github/matrix.jq builds both matrices; the full one leaves out the pull-request jobs, so each Spark,
          # Redis and JDK combination runs once.
          echo "pr=$(jq -c --arg which pr -f .github/matrix.jq "$RUNNER_TEMP/versions.json")" >> "$GITHUB_OUTPUT"
          echo "full=$(jq -c --arg which full -f .github/matrix.jq "$RUNNER_TEMP/versions.json")" >> "$GITHUB_OUTPUT"
          echo "spark_reference=$(yq '.spark_reference' versions.yml)" >> "$GITHUB_OUTPUT"
          echo "jdk=$(yq -o=json -I=0 '.jdk' versions.yml)" >> "$GITHUB_OUTPUT"
          echo "benchmark_redis=$(yq '.benchmark_redis' versions.yml)" >> "$GITHUB_OUTPUT"
          tags=()
          for line in $(yq '.redis_preview[]' versions.yml); do
            pattern="^${line//./\\.}-rc[0-9]+$"
            tag=$(curl -fsSL "https://hub.docker.com/v2/repositories/library/redis/tags?name=${line}-rc&page_size=100" \
              | jq -r --arg p "$pattern" \
                  '[.results[].name | select(test($p))] | sort_by(capture("rc(?<n>[0-9]+)$").n | tonumber) | last // empty') || tag=""
            if [ -n "$tag" ]; then
              tags+=("$tag")
            else
              echo "::notice::No release-candidate tag found for Redis $line; skipping its preview job."
            fi
          done
          echo "preview=$(printf '%s\n' "${tags[@]+"${tags[@]}"}" | jq -R . | jq -cs 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  test:
    name: Test (Spark ${{ matrix.spark }}, Redis ${{ matrix.redis }}, JDK ${{ matrix.jdk }})
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.pr) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - name: Show the Redis version under test
        run: docker run --rm "redis:${{ matrix.redis }}" redis-server --version
      - name: Test
        run: ./mvnw -B verify -pl "spark-${{ matrix.spark }}" -Dredis.image="redis:${{ matrix.redis }}"
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-spark-${{ matrix.spark }}-redis-${{ matrix.redis }}-jdk-${{ matrix.jdk }}
          path: |
            spark-${{ matrix.spark }}/target/surefire-reports/
            spark-${{ matrix.spark }}/target/site/jacoco/
          if-no-files-found: ignore

  full:
    # Never on pull requests, so a PR waits only on the `test` jobs. After a merge they show whether it broke another
    # Spark, Redis or JDK line. They may fail without failing the build during Phase 1 (D1); the exit review needs one
    # run in which every one passes.
    name: Full (Spark ${{ matrix.spark }}, Redis ${{ matrix.redis }}, JDK ${{ matrix.jdk }}, allowed to fail)
    needs: matrix
    if: github.event_name != 'pull_request' && needs.matrix.outputs.full != '{"include":[]}'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.full) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - name: Show the Redis version under test
        run: docker run --rm "redis:${{ matrix.redis }}" redis-server --version
      - name: Test
        run: ./mvnw -B verify -pl "spark-${{ matrix.spark }}" -Dredis.image="redis:${{ matrix.redis }}"
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-spark-${{ matrix.spark }}-redis-${{ matrix.redis }}-jdk-${{ matrix.jdk }}
          path: |
            spark-${{ matrix.spark }}/target/surefire-reports/
            spark-${{ matrix.spark }}/target/site/jacoco/
          if-no-files-found: ignore

  preview:
    name: Preview (Spark ${{ needs.matrix.outputs.spark_reference }}, Redis ${{ matrix.redis }}, allowed to fail)
    needs: matrix
    if: needs.matrix.outputs.preview != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        redis: ${{ fromJSON(needs.matrix.outputs.preview) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ fromJSON(needs.matrix.outputs.jdk)[0] }}
          cache: maven
      - name: Show the Redis version under test
        run: docker run --rm "redis:${{ matrix.redis }}" redis-server --version
      - name: Test
        run: ./mvnw -B verify -pl "spark-${{ needs.matrix.outputs.spark_reference }}" -Dredis.image="redis:${{ matrix.redis }}"

  benchmark:
    # The numbers come from a GitHub-hosted runner, so they are not comparable with the baseline in
    # doc/modernization/benchmarks/, which was measured on the owner's Mac. They are recorded, not gated,
    # until there is a stable runner. It runs nightly and by hand: master's ci.yml starts the nightly run as a dispatch.
    name: Benchmarks (Spark ${{ needs.matrix.outputs.spark_reference }}, Redis ${{ needs.matrix.outputs.benchmark_redis }})
    needs: matrix
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ fromJSON(needs.matrix.outputs.jdk)[0] }}
          cache: maven
      - name: Run the benchmark suites
        run: ./mvnw -B -Pbenchmark verify -pl "spark-${{ needs.matrix.outputs.spark_reference }}" -Dredis.image="redis:${{ needs.matrix.outputs.benchmark_redis }}"
      - name: Add the timings to the job summary
        if: always()
        run: |
          if [ -f target/benchmarks.csv ]; then
            {
              echo "### Benchmarks on a GitHub-hosted runner (not comparable with the Mac baseline)"
              echo
              echo "| Benchmark | ms |"
              echo "|---|---|"
              tail -n +2 target/benchmarks.csv | sed -E 's/^(.*),([0-9]+)$/| \1 | \2 |/'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-spark-${{ needs.matrix.outputs.spark_reference }}-redis-${{ needs.matrix.outputs.benchmark_redis }}
          path: target/benchmarks.csv
          if-no-files-found: ignore
