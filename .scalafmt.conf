# scalafmt formats only the Scala files an agent edits: .claude/hooks/after-edit.sh runs it on each edited file.
# Never run it over the whole tree. The 3.x code is reformatted file by file as it is edited, and Phase 2's module
# split is the time for anything wider (Phase 0 plan, step C8). scalastyle-config.xml still applies.
#
# These settings follow the existing code closely, so editing a 3.x file changes few lines beyond the edit:
# keep the author's line breaks and docstrings, bin-pack argument lists, and don't align tokens.
version = 3.11.5
runner.dialect = scala212
maxColumn = 120 # scalastyle's FileLineLengthChecker limit

newlines.source = keep
docstrings.style = keep
docstrings.wrap = no
rewrite.trailingCommas.style = keep
danglingParentheses.preset = false
optIn.configStyleArguments = false

align.preset = none
align.openParenDefnSite = true
align.openParenCallSite = false
binPack.defnSite = oneline
binPack.callSite = oneline
